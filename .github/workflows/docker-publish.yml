name: Build & Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          set -euo pipefail

          # Only a tag may publish. A manual run sits on a branch, where
          # GITHUB_REF_NAME is the branch name — that was treated as a version
          # and moved :latest to whatever happened to be on that branch.
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::This workflow publishes from a tag only (got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'). Push a vX.Y.Z tag instead."
            exit 1
          fi

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not vX.Y.Z or vX.Y.Z-suffix."
            exit 1
          fi

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="${IMAGE,,}"  # lowercase

          VERSION="${GITHUB_REF_NAME#v}"

          # Keep the image and the version the app reports in its Web UI in step
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${VERSION}" != "${PKG_VERSION}" ]]; then
            echo "::error::Tag version '${VERSION}' does not match package.json '${PKG_VERSION}'."
            exit 1
          fi

          # A suffix marks a pre-release and must never move :latest. A -dev
          # suffix additionally moves the rolling :dev tag, further iterations
          # (-dev.2 and so on) included. Any other suffix publishes its exact
          # version only, so an -rc or -beta cannot reach users on :latest.
          case "${VERSION}" in
            *-dev|*-dev.*) TAGS="${IMAGE}:${VERSION},${IMAGE}:dev" ;;
            *-*)           TAGS="${IMAGE}:${VERSION}" ;;
            *)             TAGS="${IMAGE}:${VERSION},${IMAGE}:latest" ;;
          esac

          echo "Publishing: ${TAGS}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=AMS Spoolman Manager
            org.opencontainers.image.description=Bambu Lab AMS ↔ Spoolman filament status manager
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
