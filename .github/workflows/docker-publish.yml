name: Build & Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # The release step writes to the repository's releases, the image push
      # writes to the package registry.
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          set -euo pipefail

          # Only a tag may publish. A manual run sits on a branch, where
          # GITHUB_REF_NAME is the branch name, which was treated as a version
          # and moved :latest to whatever happened to be on that branch.
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::This workflow publishes from a tag only (got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'). Push a vX.Y.Z tag instead."
            exit 1
          fi

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not vX.Y.Z or vX.Y.Z-suffix."
            exit 1
          fi

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="${IMAGE,,}"  # lowercase

          VERSION="${GITHUB_REF_NAME#v}"

          # Keep the image and the version the app reports in its Web UI in step
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${VERSION}" != "${PKG_VERSION}" ]]; then
            echo "::error::Tag version '${VERSION}' does not match package.json '${PKG_VERSION}'."
            exit 1
          fi

          # A suffix marks a pre-release and must never move :latest. A -dev
          # suffix additionally moves the rolling :dev tag, further iterations
          # (-dev.2 and so on) included. Any other suffix publishes its exact
          # version only, so an -rc or -beta cannot reach users on :latest.
          # The same suffix that keeps a version off :latest also makes its
          # GitHub release a pre-release, so the two cannot drift apart: an
          # image that is not :latest is never the release users are pointed at.
          case "${VERSION}" in
            *-dev|*-dev.*) TAGS="${IMAGE}:${VERSION},${IMAGE}:dev"    ; PRERELEASE=true  ;;
            *-*)           TAGS="${IMAGE}:${VERSION}"                 ; PRERELEASE=true  ;;
            *)             TAGS="${IMAGE}:${VERSION},${IMAGE}:latest" ; PRERELEASE=false ;;
          esac

          echo "Publishing: ${TAGS} (prerelease: ${PRERELEASE})"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          # Build time for the OCI created label. The repository's updated_at
          # was used here, which is when the repo last changed, not when this
          # image was built.
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=AMS Spoolman Manager
            org.opencontainers.image.description=Bambu Lab AMS ↔ Spoolman filament status manager
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs after the push on purpose: a release that points at an image which
      # never got built would send people to a pull that fails.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tags.outputs.version }}
          PRERELEASE: ${{ steps.tags.outputs.prerelease }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail

          # Every CHANGELOG.md section belonging to this release's version line,
          # not just the one for this exact tag. A prerelease is one step of a
          # version, so 1.3.0-dev.3 on its own would show the last step and
          # hide the features that 1.3.0-dev.2 introduced; the stable 1.3.0
          # would hide all of them. Sections are emitted newest first, the
          # order they stand in the file.
          #
          # The separator is matched as "starts with ---" rather than by a
          # counted interval, which mawk, the awk on the runner, does not
          # support.
          BASE="${VERSION%%-*}"
          NOTES="$(awk -v base="${BASE}" '
            /^Version / {
              v = substr($0, 9)
              if (open) { print "```"; open = 0 }
              if (v == base || index(v, base "-") == 1) {
                print ""
                print "#### " v
                print "```"
                open = 1
                blanks = 0
              }
              next
            }
            open && /^---/ { print "```"; open = 0; blanks = 0; next }
            open {
              # Hold blank lines back until a real line follows, so the blank
              # line every section ends with does not sit inside the fence.
              if ($0 ~ /^[ \t]*$/) { blanks++; next }
              while (blanks-- > 0) print ""
              blanks = 0
              print
            }
            END { if (open) print "```" }
          ' CHANGELOG.md)"

          {
            if [[ -n "${NOTES//[[:space:]]/}" ]]; then
              # Fenced per section, because the changelog is indented plain
              # text: as markdown its deeper levels would collapse into code
              # blocks halfway and read as a mess.
              if [[ "${PRERELEASE}" == "true" ]]; then
                echo "### Changes in ${BASE} so far"
              else
                echo "### Changes in ${BASE}"
              fi
              printf '%s\n' "${NOTES}"
            else
              echo "No CHANGELOG.md section for ${VERSION}."
            fi

            echo
            echo "### Docker"
            echo
            echo '```bash'
            # Every tag this run published, so the notes cannot claim a tag that
            # was not pushed: for a stable version that is :latest as well.
            echo "${TAGS}" | tr ',' '\n' | while read -r tag; do
              [[ -n "${tag}" ]] && echo "docker pull ${tag}"
            done
            echo '```'
            if [[ "${PRERELEASE}" == "true" ]]; then
              echo
              echo "This is a pre-release. \`:latest\` still points at the last stable version."
            fi
          } > release-notes.md

          # A re-run of the workflow for a tag that already has a release should
          # update it rather than fail on the second attempt.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --prerelease="${PRERELEASE}" \
              --latest="$([[ "${PRERELEASE}" == "true" ]] && echo false || echo true)"
            echo "Updated the existing release ${GITHUB_REF_NAME}."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --prerelease="${PRERELEASE}" \
              --latest="$([[ "${PRERELEASE}" == "true" ]] && echo false || echo true)"
            echo "Created the release ${GITHUB_REF_NAME} (prerelease: ${PRERELEASE})."
          fi
