name: Tests

on:
  pull_request:
  push:
    branches:
      - main

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # One red version should not hide the result of the other.
      fail-fast: false
      matrix:
        # 22 is what the Docker image ships (see Dockerfile), so it is the
        # version that actually has to pass. 24 is early warning for the code
        # itself; it cannot become the base image while linux/arm/v7 is a
        # published platform, because node:24-alpine has no armv7 build.
        node: ['22', '24']

    name: node ${{ matrix.node }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci installs from package-lock.json only, so a package that is
      # imported but missing from package.json fails here rather than in the
      # Docker build.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
