# How GitHub groups the pull requests of a release.
#
# Read by the releases/generate-notes API, which the publish workflow calls for
# every release, pre-release included. A pull request lands in the first
# category whose labels it carries, so the order below is the order of the
# sections and the reason a PR labelled both "enhancement" and "bug" is listed
# as a feature rather than twice.
#
# This is why pull requests are labelled before they are merged: an unlabelled
# one ends up under "Everything else", where nobody looks for it.
#
# "Breaking" comes first for the same reason: a change that can break an existing
# installation is almost always a feature or a fix as well, so it carries both
# labels, and the first category wins. Listed under New Features it reads like
# something to look forward to.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking Changes
      labels:
        - breaking
    - title: New Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Deprecations
      labels:
        - deprecation
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - maintenance
    # The catch-all has to stay last: it matches everything, so anything after
    # it would never be reached.
    - title: Everything else
      labels:
        - "*"
