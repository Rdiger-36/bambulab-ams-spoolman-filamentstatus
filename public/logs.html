<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Logs</title>
    <link rel="stylesheet" href="styles.css">
    <script>
      // Applies the stored theme before the first paint so page changes do not flash.
      try {
        if (localStorage.getItem("dark-mode") === "true") {
          document.documentElement.classList.add("dark-mode");
        }
      } catch (error) { /* Storage blocked: stay in light mode. */ }
    </script>
</head>
<body class="hide-footer logs-page">
    <div id="menubar">
        <!-- The whole bar, including the dark mode button, is filled by menu.js -->
        <div id="menu-root"></div>
    </div>
    <div class="page-width log-page">
        <!-- The name is a picker over the logs, filled by menu.js -->
        <h3 class="log-title">Backend Logs for: <span id="headline"></span></h3>
        <div id="log-box">
            <div id="logs"></div>
        </div>
        <!-- Under the log it downloads, and always on screen: the box above it
             takes the height that is left rather than growing past it -->
        <div class="log-actions">
            <button id="download-logs" class="log-button">Download this log file...</button>
        </div>
    </div>
    <script src="menu.js"></script>
    <script src="export.js"></script>
    <script src="logs.js"></script>
</body>
</html>
