<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMS Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="show-footer">
  <div id="menubar">
    <!-- Menu with the printer, settings and log entries, filled by menu.js -->
    <div id="menu-root"></div>
    <!-- Dark Mode Button -->
    <button id="dark-mode-toggle">
        <img id="dark-mode-icon" src="https://img.icons8.com/ios-glyphs/30/moon-symbol.png" alt="Toggle Dark Mode">
    </button>
  </div>

  <!-- App Content -->
  <div id="app">
    <h1>Loaded Spools on AMS from <span id="printer-name"></span></h1>
    <div id="status" class="status-card">
      <div class="status-head">
        <span id="tracking-mode" class="pill"></span>
        <span class="monitoring-align">
          Monitoring
          <label class="switch">
            <input type="checkbox" id="monitoring-toggle">
            <span class="slider round"></span>
          </label>
        </span>
      </div>
      <div class="status-grid">
        <div class="status-item">
          <span class="status-label">Spoolman</span>
          <span id="spoolman-status" class="status-value"></span>
        </div>
        <div class="status-item">
          <span class="status-label">Printer (MQTT)</span>
          <span id="mqtt-status" class="status-value"></span>
        </div>
        <div class="status-item">
          <span class="status-label">Serial number</span>
          <span id="printer-serial" class="status-value"></span>
        </div>
        <div class="status-item">
          <span class="status-label">Operation mode</span>
          <span id="mode" class="status-value"></span>
        </div>
        <div class="status-item">
          <span class="status-label">Last update</span>
          <span id="last-mqtt-update" class="status-value"></span>
        </div>
        <div class="status-item">
          <span class="status-label">Last new AMS info</span>
          <span id="last-mqtt-ams-update" class="status-value"></span>
        </div>
      </div>
    </div>
    <div id="spool-list"></div>
  </div>
  <footer id="dynamic-footer" class="footer">
      <div class="container">
          <div class="content">
          </div>
      </div>
  </footer>

  <script src="menu.js"></script>
  <script src="frontend.js"></script>

  <dialog id="info-dialog">
    <h3><span id="button-header" style="display: block; text-align: center;"></span></h3>
    <div id="dialog-content"></div>
    <div class="button-container">
      <button class="btn" id="close-dialog">Close</button>
      <button class="btn btn-primary" id="action-button"><span id="action-button"></span></button>
    </div>
  </dialog>
</body>
</html>
