<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMS Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Applies the stored theme before the first paint so page changes do not flash.
    try {
      if (localStorage.getItem("dark-mode") === "true") {
        document.documentElement.classList.add("dark-mode");
      }
    } catch (error) { /* Storage blocked: stay in light mode. */ }
  </script>
</head>
<body class="show-footer">
  <div id="menubar">
    <!-- The whole bar, including the dark mode button, is filled by menu.js -->
    <div id="menu-root"></div>
  </div>

  <!-- App Content -->
  <div id="app" class="page-width">
    <div id="status" class="status-card">
      <!-- The title in the middle, the two things that are not the title at
           the two ends: what it is tracked with, and whether it is running.
           The printer name is a picker, filled by menu.js. -->
      <div class="status-head">
        <div class="status-head-side">
          <span id="tracking-mode" class="pill"></span>
        </div>
        <h1 class="status-title">Loaded Spools on <span id="printer-name"></span></h1>
        <div class="status-head-side status-head-side-end">
          <label class="status-toggle" title="Reads this printer over MQTT and writes what it finds to Spoolman">
            <span>Monitoring</span>
            <span class="set-switch set-switch-alarm">
              <input type="checkbox" id="monitoring-toggle">
              <span class="set-switch-track"></span>
            </span>
          </label>
        </div>
      </div>
      <div class="status-grid">
        <div class="status-item">
          <span class="status-label">Spoolman</span>
          <span id="spoolman-status" class="status-value"></span>
        </div>
        <div class="status-item">
          <span class="status-label">Printer (MQTT)</span>
          <span id="mqtt-status" class="status-value"></span>
        </div>
        <div class="status-item">
          <span class="status-label">Serial number</span>
          <span id="printer-serial" class="status-value"></span>
        </div>
        <div class="status-item">
          <span class="status-label">Operation mode</span>
          <span id="mode" class="status-value"></span>
        </div>
        <div class="status-item">
          <span class="status-label">Last update</span>
          <span id="last-mqtt-update" class="status-value"></span>
        </div>
        <div class="status-item">
          <span class="status-label">Last new AMS info</span>
          <span id="last-mqtt-ams-update" class="status-value"></span>
        </div>
      </div>
    </div>
    <div id="spool-list"></div>
  </div>
  <footer id="dynamic-footer" class="footer">
      <div class="container">
          <div class="content">
          </div>
      </div>
  </footer>

  <script src="menu.js"></script>
  <!-- A module, so it can import the decisions it shares with the server from
       shared.js. Modules are deferred, so it still runs before DOMContentLoaded
       and after menu.js, whose functions it calls as globals. -->
  <script type="module" src="frontend.js"></script>

  <dialog id="notice-dialog">
    <h3 id="notice-dialog-title"></h3>
    <div id="notice-dialog-content"></div>
    <div class="button-container">
      <button class="btn" id="notice-dialog-close">Got it</button>
      <button class="btn btn-primary" id="notice-dialog-open">Open the settings</button>
    </div>
  </dialog>

  <!-- Opened by clicking a filament name in either table. Its own dialog rather
       than #info-dialog, because it carries tabs and edits its fields in place,
       not the one confirm button that one is shaped around. -->
  <dialog id="spool-detail-dialog">
    <h3 id="spool-detail-title"></h3>
    <div id="spool-detail-content"></div>
    <div class="button-container">
      <button class="btn" id="spool-detail-close">Close</button>
    </div>
  </dialog>

  <dialog id="info-dialog">
    <h3><span id="button-header" style="display: block; text-align: center;"></span></h3>
    <div id="dialog-content"></div>
    <div class="button-container">
      <button class="btn" id="close-dialog">Close</button>
      <button class="btn btn-primary" id="action-button"><span id="action-button"></span></button>
    </div>
  </dialog>
</body>
</html>
