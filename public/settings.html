<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="settings.pageTitle">Settings</title>
    <link rel="stylesheet" href="styles.css">
    <script>
      // Applies the stored theme before the first paint so page changes do not flash.
      try {
        if (localStorage.getItem("dark-mode") === "true") {
          document.documentElement.classList.add("dark-mode");
        }
      } catch (error) { /* Storage blocked: stay in light mode. */ }
    </script>
    <script src="i18n.js"></script>
    <script src="i18n/all.js"></script>
</head>
<body class="hide-footer settings-page">
    <div id="menubar">
        <!-- The whole bar, including the dark mode button, is filled by menu.js -->
        <div id="menu-root"></div>
    </div>

    <div class="set-page">
        <div class="set-page-head">
            <h1 data-i18n="settings.pageTitle">Settings</h1>
            <span class="set-page-note" data-i18n="settings.pageNote">Stored in printers/settings.json and applied without a restart, unless a field says otherwise.</span>
        </div>

        <!-- Filled by settings.js from /api/notices, and hidden while nothing
             on this installation is still configured from the environment.
             Apart from #set-banner, which carries one message at a time. -->
        <div id="set-env-info" class="set-page-info" hidden></div>

        <div id="set-banner" class="set-banner"></div>

        <div class="set-card">
            <div class="set-card-head">
                <h2 data-i18n="settings.printers.title">Printers</h2>
                <button class="btn btn-primary" id="add-printer" data-i18n="settings.printers.add">Add printer</button>
            </div>
            <div id="printer-table"></div>
        </div>

        <form id="settings-form">
            <div id="settings-groups"></div>

            <!-- Inside the form so the sticky save bar stays the last element on
                 the page. type="button" keeps the restart out of the submit. -->
            <div class="set-card">
                <div class="set-card-head">
                    <h2 data-i18n="settings.service.title">Service</h2>
                </div>
                <p class="set-note" data-i18n="settings.service.note">What this installation is running, and the actions that work on the
                    running service itself rather than on a stored setting.</p>

                <dl class="set-facts" id="system-info"></dl>
                <p class="set-note" id="update-note"></p>
                <p class="set-note" id="service-note"></p>

                <!-- The restart sits at the end of this row, apart from the three
                     that leave the process running. -->
                <div class="set-service-actions">
                    <button class="btn" type="button" id="download-diagnostics" data-i18n="settings.service.diagnostics">Download diagnostics...</button>
                    <button class="btn" type="button" id="reconnect-printers" data-i18n="settings.service.reconnect">Reconnect all printers</button>
                    <button class="btn" type="button" id="toggle-monitoring" data-i18n="settings.service.pauseMonitoring">Pause all monitoring</button>
                    <button class="btn btn-danger-solid set-action-end" type="button" id="restart-service" data-i18n="settings.service.restart">Restart service</button>
                </div>
            </div>

            <div class="set-actions">
                <button class="btn btn-primary" type="submit" id="save-settings" disabled data-i18n="settings.save">Save settings</button>
                <button class="btn" type="button" id="reload-settings" disabled data-i18n="settings.discard">Discard changes</button>
                <span class="set-actions-hint" id="dirty-hint"></span>
            </div>
        </form>
    </div>

    <script src="menu.js"></script>
    <script src="export.js"></script>
    <script type="module" src="settings.js"></script>

    <dialog id="printer-dialog">
        <h3 id="printer-dialog-title"></h3>
        <div class="set-form" id="printer-dialog-fields"></div>
        <p class="set-error" id="printer-dialog-error"></p>
        <div id="printer-test-result" class="set-test-result"></div>
        <div class="button-container">
            <button class="btn" id="printer-dialog-test" type="button" data-i18n="settings.testConnection">Test connection</button>
            <button class="btn" id="printer-dialog-cancel" type="button" data-i18n="settings.cancel">Cancel</button>
            <button class="btn btn-primary" id="printer-dialog-save" type="button" data-i18n="settings.saveButton">Save</button>
        </div>
    </dialog>

    <dialog id="apikey-dialog">
        <h3 id="apikey-dialog-title" data-i18n="settings.apikeys.newTitle">New API key</h3>
        <div id="apikey-dialog-body"></div>
        <p class="set-error" id="apikey-dialog-error"></p>
        <div class="button-container">
            <button class="btn" id="apikey-dialog-cancel" type="button" data-i18n="settings.cancel">Cancel</button>
            <button class="btn btn-primary" id="apikey-dialog-save" type="button" data-i18n="settings.apikeys.create">Create key</button>
        </div>
    </dialog>

    <!-- Level, areas and the raw MQTT trace. Opened from the Logging card for
         the global settings and from a printer row for that printer's own. -->
    <dialog id="logdetail-dialog">
        <h3 id="logdetail-dialog-title"></h3>
        <div id="logdetail-dialog-body"></div>
        <p class="set-error" id="logdetail-dialog-error"></p>
        <div class="button-container">
            <button class="btn" id="logdetail-dialog-cancel" type="button" data-i18n="settings.cancel">Cancel</button>
            <button class="btn btn-primary" id="logdetail-dialog-save" type="button" data-i18n="settings.saveButton">Save</button>
        </div>
    </dialog>

    <dialog id="confirm-dialog">
        <h3 id="confirm-dialog-title"></h3>
        <div id="confirm-dialog-text"></div>
        <div class="button-container">
            <button class="btn" id="confirm-dialog-cancel" type="button" data-i18n="settings.cancel">Cancel</button>
            <button class="btn btn-danger" id="confirm-dialog-ok" type="button" data-i18n="settings.delete">Delete</button>
        </div>
    </dialog>
</body>
</html>
