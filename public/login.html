<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.pageTitle">Sign in</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script>
      // Applies the stored theme before the first paint so page changes do not flash.
      try {
        if (localStorage.getItem("dark-mode") === "true") {
          document.documentElement.classList.add("dark-mode");
        }
      } catch (error) { /* Storage blocked: stay in light mode. */ }
    </script>
    <script src="i18n.js"></script>
    <script src="i18n/all.js"></script>
</head>
<body class="hide-footer">
    <div id="app">
        <form id="login-form" class="login-card" autocomplete="on">
            <h1>HaspelSync</h1>
            <p class="login-lead" data-i18n="login.lead">This installation asks for a password.</p>

            <label class="login-label" for="login-password" data-i18n="login.password">Password</label>
            <input type="password" id="login-password" name="password" autocomplete="current-password" autofocus>

            <button type="submit" id="login-submit" data-i18n="login.submit">Sign in</button>
            <p id="login-error" class="login-error" hidden></p>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
