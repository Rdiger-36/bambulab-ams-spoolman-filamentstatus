<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.pageTitle">Sign in</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script>
      // Applies the stored theme before the first paint so page changes do not flash.
      try {
        if (localStorage.getItem("dark-mode") === "true") {
          document.documentElement.classList.add("dark-mode");
        }
      } catch (error) { /* Storage blocked: stay in light mode. */ }
    </script>
    <script src="i18n.js"></script>
    <script src="i18n/all.js"></script>
</head>
<body class="hide-footer login-page">
    <!-- The bar of this page, written here rather than by menu.js: that script
         asks the service for the printers, which is behind the password this
         page asks for. Nothing to navigate to yet, so it carries the brand, the
         language and the theme and no more. The spool is the one from the menu
         bar, its flanges in the text colour. login.js fills the language menu
         and wires the two buttons. -->
    <div id="menubar">
        <div id="menu-root">
        <nav class="menunav" aria-label="Main" data-i18n-aria-label="menu.main">
            <span class="menu-brand">
                <svg class="menu-brand-icon" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true" focusable="false">
                    <defs><clipPath id="login-brand-winding"><rect x="15" y="9" width="34" height="46"/></clipPath></defs>
                    <rect x="2" y="27.5" width="60" height="9" rx="4.5" fill="#8c8c8c"/>
                    <g clip-path="url(#login-brand-winding)">
                        <rect x="15" y="9" width="34" height="46" fill="#00ae42"/>
                        <path d="M37 9 L49 9 L49 55 L27 55 Z" fill="#dc7734"/>
                    </g>
                    <rect x="5" y="2" width="11" height="60" rx="4" fill="currentColor"/>
                    <rect x="48" y="2" width="11" height="60" rx="4" fill="currentColor"/>
                </svg>
                <span class="menu-wordmark">Haspel<b>Sync</b></span>
            </span>
            <div class="menu-end">
                <button id="dark-mode-toggle" type="button" title="Light and dark mode" data-i18n-title="menu.theme" aria-label="Toggle dark mode" data-i18n-aria-label="menu.themeToggle">
                    <span id="dark-mode-icon"></span>
                </button>
                <div class="menu-host">
                    <button class="menu-tool menu-caret" type="button" id="language-button"
                            aria-haspopup="true" aria-expanded="false" aria-controls="language-panel"
                            title="Language" data-i18n-title="login.language" aria-label="Language" data-i18n-aria-label="login.language">
                        <svg class="menu-glyph" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false">
                            <circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M1.7 8h12.6M8 1.7c2.4 2.6 2.4 10 0 12.6M8 1.7c-2.4 2.6-2.4 10 0 12.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
                        </svg>
                    </button>
                    <div class="menu-panel menu-panel-end" id="language-panel" hidden></div>
                </div>
            </div>
        </nav>
        </div>
    </div>

    <div id="app">
        <form id="login-form" class="login-card" autocomplete="on">
            <h1 data-i18n="login.pageTitle">Sign in</h1>
            <p class="login-lead" data-i18n="login.lead">This installation asks for a password.</p>

            <label class="login-label" for="login-password" data-i18n="login.password">Password</label>
            <input type="password" id="login-password" name="password" autocomplete="current-password" autofocus>

            <button type="submit" id="login-submit" data-i18n="login.submit">Sign in</button>
            <p id="login-error" class="login-error" hidden></p>
        </form>
    </div>

    <!-- The footer of the dashboard, without the version and the Spoolman
         link: both are read from the API, which is behind the password this
         page asks for, and the version of an installation is not told to
         whoever reaches its login page. login.js fills in the year. -->
    <footer class="footer">
        <div class="container">
            <div class="content">
                <span id="login-year"></span> |
                <a href="https://github.com/Rdiger-36/HaspelSync" target="_blank" rel="noopener" data-i18n="dashboard.footer.repository">GitHub Repository</a> -
                <span data-i18n="dashboard.footer.createdBy">Created by</span>
                <a href="https://github.com/Rdiger-36" target="_blank" rel="noopener">Rdiger-36</a>
            </div>
        </div>
    </footer>

    <script src="login.js"></script>
</body>
</html>
