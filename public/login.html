<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.pageTitle">Sign in</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script>
      // Applies the stored theme before the first paint so page changes do not flash.
      try {
        if (localStorage.getItem("dark-mode") === "true") {
          document.documentElement.classList.add("dark-mode");
        }
      } catch (error) { /* Storage blocked: stay in light mode. */ }
    </script>
    <script src="i18n.js"></script>
    <script src="i18n/all.js"></script>
</head>
<body class="hide-footer">
    <div id="app">
        <form id="login-form" class="login-card" autocomplete="on">
            <!-- The brand, drawn here because this page imports nothing from
                 the rest of the UI: the same spool as in the menu bar, its
                 flanges in the text colour. -->
            <h1 class="login-brand">
                <svg class="login-brand-icon" viewBox="0 0 64 64" width="44" height="44" aria-hidden="true" focusable="false">
                    <defs><clipPath id="login-brand-winding"><rect x="15" y="9" width="34" height="46"/></clipPath></defs>
                    <rect x="2" y="27.5" width="60" height="9" rx="4.5" fill="#8c8c8c"/>
                    <g clip-path="url(#login-brand-winding)">
                        <rect x="15" y="9" width="34" height="46" fill="#00ae42"/>
                        <path d="M37 9 L49 9 L49 55 L27 55 Z" fill="#dc7734"/>
                    </g>
                    <rect x="5" y="2" width="11" height="60" rx="4" fill="currentColor"/>
                    <rect x="48" y="2" width="11" height="60" rx="4" fill="currentColor"/>
                </svg>
                <span class="login-wordmark">Haspel<b>Sync</b></span>
            </h1>
            <p class="login-lead" data-i18n="login.lead">This installation asks for a password.</p>

            <label class="login-label" for="login-password" data-i18n="login.password">Password</label>
            <input type="password" id="login-password" name="password" autocomplete="current-password" autofocus>

            <button type="submit" id="login-submit" data-i18n="login.submit">Sign in</button>
            <p id="login-error" class="login-error" hidden></p>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
