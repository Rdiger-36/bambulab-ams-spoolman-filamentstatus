# HaspelSync built from this checkout, for trying a branch in a container
# before it is published. The build context is the repository root, where
# .dockerignore lives, so the image is the same one the publish workflow builds.
#
#     docker compose -f docker/compose.local.yml up -d --build
services:
  haspelsync:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: haspelsync:local
    container_name: haspelsync
    ports:
      - 4000:4000
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./data/printers:/app/printers
      - ./data/logs:/app/logs
    restart: unless-stopped
